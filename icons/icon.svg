  <path d="M150 198 L126 62 L254 148 Z" fill="#FFFFFF" stroke="#E60012" stroke-width="15" stroke-linejoin="round"/>
  <!-- 右耳 -->
  <path d="M362 198 L386 62 L258 148 Z" fill="#FFFFFF" stroke="#E60012" stroke-width="15" stroke-linejoin="round"/>
  <!-- 头 -->
