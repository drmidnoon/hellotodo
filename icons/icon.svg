    <line x1="152" y1="292" x2="92" y2="280"/>
    <line x1="152" y1="316" x2="90" y2="318"/>
    <line x1="152" y1="340" x2="94" y2="354"/>
    <line x1="360" y1="292" x2="420" y2="280"/>
    <line x1="360" y1="316" x2="422" y2="318"/>
    <line x1="360" y1="340" x2="418" y2="354"/>
  </g>
  <!-- 蝴蝶结（左耳旁，Hello Kitty 标志性元素） -->
  <circle cx="144" cy="148" r="48" fill="#E60012"/>
  <circle cx="208" cy="148" r="48" fill="#E60012"/>
  <circle cx="176" cy="148" r="20" fill="#FF6B7A"/>
  <circle cx="144" cy="148" r="8" fill="#FFFFFF"/>
  <circle cx="208" cy="148" r="8" fill="#FFFFFF"/>
</svg>
